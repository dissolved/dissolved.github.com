title: Code Dissolved
name: Code Dissolved
author: Ryan Sandridge
lang: en-US
description: Notes on software development
url: https://codedissolved.com
baseurl: ""

footer-links:
  github: dissolved
  linkedin: ryansandridge
  rss: true
  twitter: dissolved
  stackoverflow: users/288448/ryan-sandridge

social:
  name: Ryan Sandridge
  links:
    - https://github.com/dissolved
    - https://www.linkedin.com/in/ryansandridge

defaults:
  - scope:
      path: ""
    values:
      image: /images/social-card.png

# Comments are stored in GitHub Discussions. Requires the giscus GitHub App.
giscus:
  repo: dissolved/dissolved.github.com
  repo_id: MDEwOlJlcG9zaXRvcnk3MTc3NTY=
  category: Announcements
  category_id: DIC_kwDOAArzvM4DIWLf

# Leave blank to disable analytics. Tracking is limited to production builds
# running on the hostname in `url`.
goatcounter: https://dissolved.goatcounter.com/count

permalink: /:title/
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

sass:
  style: compressed

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

include: ['_pages']
paginate: 28
paginate_path: /page:num/

exclude:
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
  - giscus.json
  - ideas-and-notes
  - scripts
