{% if jekyll.environment == 'production' and site.goatcounter %}
<script>
  window.goatcounter = {
    no_onload: window.location.hostname !== new URL({{ site.url | jsonify }}).hostname
  };
</script>
<script data-goatcounter="{{ site.goatcounter | escape }}"
        async src="https://gc.zgo.at/count.js"></script>
{% endif %}
