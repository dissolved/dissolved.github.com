{% if site.giscus.repo and page.comments != false %}
<section class="comments" aria-labelledby="comments-heading">
  <h2 id="comments-heading">Discussion</h2>
  <p>Questions, corrections, or another approach? Join the discussion with your GitHub account.
    Please follow the <a href="{{ '/comment-policy/' | relative_url }}">comment policy</a>.</p>
  <div class="giscus"></div>
  <script src="https://giscus.app/client.js"
          data-repo="{{ site.giscus.repo }}"
          data-repo-id="{{ site.giscus.repo_id }}"
          data-category="{{ site.giscus.category }}"
          data-category-id="{{ site.giscus.category_id }}"
          data-mapping="pathname"
          data-strict="1"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="top"
          data-theme="light"
          data-lang="en"
          data-loading="lazy"
          crossorigin="anonymous"
          async></script>
  <p><a href="https://github.com/{{ site.giscus.repo }}/discussions">Browse discussions on GitHub</a></p>
</section>
{% endif %}
