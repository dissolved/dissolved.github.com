{% if site.footer-links.github %}<a href="https://github.com/{{ site.footer-links.github }}" aria-label="GitHub"><i aria-hidden="true" class="svg-icon github"></i></a>{% endif %}
{% if site.footer-links.linkedin %}<a href="https://www.linkedin.com/in/{{ site.footer-links.linkedin }}" aria-label="LinkedIn"><i aria-hidden="true" class="svg-icon linkedin"></i></a>{% endif %}
{% if site.footer-links.rss %}<a href="{{ site.baseurl }}/feed.xml" aria-label="Atom feed"><i aria-hidden="true" class="svg-icon rss"></i></a>{% endif %}
{% if site.footer-links.twitter %}<a href="https://www.twitter.com/{{ site.footer-links.twitter }}" aria-label="Twitter"><i aria-hidden="true" class="svg-icon twitter"></i></a>{% endif %}
{% if site.footer-links.stackoverflow %}<a href="https://stackoverflow.com/{{ site.footer-links.stackoverflow }}" aria-label="Stack Overflow"><i aria-hidden="true" class="svg-icon stackoverflow"></i></a>{% endif %}
